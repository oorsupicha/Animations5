<title>Studio_BadlandS &mdash; Animation Catalog</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:#1a1a1a;color:#e0e0e0;display:flex;height:100vh;overflow:hidden;font-size:13px}
#sidebar{width:190px;min-width:190px;background:#111;display:flex;flex-direction:column;overflow-y:auto;border-right:1px solid #333}
#sidebar h2{padding:14px 12px 2px;font-size:13px;color:#888;text-transform:uppercase;letter-spacing:1px}
#version{padding:2px 12px 8px;font-size:10px;color:#3d3d3d;border-bottom:1px solid #222;letter-spacing:.5px}
.nav-section{padding:10px 12px 4px;font-size:10px;color:#555;text-transform:uppercase;letter-spacing:1px}
.nav-btn{display:flex;justify-content:space-between;align-items:center;gap:6px;width:100%;padding:8px 14px;text-align:left;background:none;border:none;color:#ccc;cursor:pointer;font-size:12.5px;border-left:3px solid transparent;transition:background .15s}
.nav-btn:hover{background:#1e1e1e;color:#fff}
.nav-btn.active{background:#1e2a3a;color:#4da6ff;border-left-color:#4da6ff;font-weight:600}
.nav-count{font-size:10px;color:#555;background:#1c1c1c;border-radius:9px;padding:1px 6px}
.nav-btn.active .nav-count{color:#4da6ff;background:#16283c}
#main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
#topbar{background:#141414;padding:9px 16px;border-bottom:1px solid #2a2a2a;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
#topbar h1{font-size:15px;color:#fff;margin-right:6px;white-space:nowrap}
#panel-sub{font-size:11px;color:#666;white-space:nowrap}
.filter-input,select.filter-input{background:#222;border:1px solid #444;color:#e0e0e0;padding:5px 9px;border-radius:4px;font-size:12px}
.filter-input{width:170px}
.filter-input::placeholder{color:#555}
.filter-input:focus{outline:none;border-color:#4da6ff}
.btn-group{display:flex;gap:3px;align-items:center}
.grp-label{font-size:10px;color:#4a4a4a;text-transform:uppercase;letter-spacing:.5px;margin-right:2px}
.filt-btn{background:#222;border:1px solid #444;color:#aaa;padding:4px 9px;border-radius:4px;font-size:11px;cursor:pointer;transition:all .15s;white-space:nowrap}
.filt-btn:hover{background:#2a2a2a;color:#fff}
.filt-btn.active{background:#1e3a5f;border-color:#4da6ff;color:#4da6ff}
.filt-btn.blend-btn.active{background:#2a1e3a;border-color:#a060f0;color:#c080ff}
.filt-btn.use-btn.active{background:#12301e;border-color:#4ec97a;color:#7fe3a0}
#content{flex:1;overflow:auto;padding:14px 16px 40px}
table.t{width:100%;border-collapse:collapse;font-size:12px}
table.t th{background:#1e1e1e;color:#888;padding:7px 10px;text-align:left;border-bottom:2px solid #333;position:sticky;top:0;z-index:2;white-space:nowrap;font-weight:600}
table.t td{padding:6px 10px;border-bottom:1px solid #222;color:#ccc;vertical-align:top}
table.t tr:hover td{background:#1e1e1e}
.mono{font-family:Consolas,'Courier New',monospace}
.muted{color:#5a5a5a}
.chip{display:inline-block;border-radius:9px;padding:1px 7px;font-size:10px;margin:1px 3px 1px 0;white-space:nowrap;background:#242424;color:#999}
.chip.slot{background:#14283c;color:#6fb4f0}
.chip.cfg{background:#2b2416;color:#d4a458}
.badge{display:inline-block;border-radius:9px;padding:1px 7px;font-size:10px;font-weight:600;white-space:nowrap}
.b-used{background:#12301e;color:#7fe3a0}
.b-unused{background:#301616;color:#e08080}
.stat-bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.stat{background:#1c1c1c;border:1px solid #2c2c2c;border-radius:6px;padding:10px 16px;min-width:120px}
.stat span{display:block;font-size:21px;color:#4da6ff;font-weight:600;line-height:1.2}
.stat small{font-size:11px;color:#777}
.stat.good span{color:#7fe3a0}
.stat.warn span{color:#e0a060}
.stat.bad span{color:#e08080}
h3.sec{font-size:13px;color:#9ab;margin:20px 0 8px;padding-bottom:5px;border-bottom:1px solid #262626}
h3.sec:first-child{margin-top:0}
.tabs{display:flex;gap:2px;border-bottom:1px solid #2a2a2a;margin-bottom:14px}
.tab{background:none;border:none;border-bottom:2px solid transparent;color:#888;padding:8px 16px;font-size:12.5px;cursor:pointer}
.tab:hover{color:#ddd}
.tab.active{color:#4da6ff;border-bottom-color:#4da6ff;font-weight:600}
.expander{cursor:pointer;user-select:none}
.expander:hover{background:#1e1e1e}
.arrow{display:inline-block;width:11px;color:#555}
.sub-row td{background:#151515;padding:8px 10px 10px 30px;border-bottom:1px solid #222}
.note{background:#161616;border-left:3px solid #3a3a3a;padding:9px 12px;margin-bottom:14px;font-size:11.5px;color:#8a8a8a;line-height:1.6}
.note b{color:#bbb}
.matrix{border-collapse:collapse;font-size:11px;white-space:nowrap}
.matrix th,.matrix td{border:1px solid #2a2a2a;padding:5px 9px;text-align:center}
.matrix th{background:#1e1e1e;color:#888;position:sticky;top:0;z-index:2}
.matrix th.rh{text-align:left;background:#1a1a1a;position:sticky;left:0;z-index:1;min-width:110px}
.matrix td.rh{text-align:left;background:#181818;color:#ccc;position:sticky;left:0;font-weight:600}
.matrix td.z{color:#333}
.empty{color:#666;padding:30px;text-align:center;font-style:italic}
.play{display:inline-flex;align-items:center;justify-content:center;width:24px;height:20px;border-radius:4px;background:#1e3a5f;color:#7ab8f5;border:1px solid #2d5680;cursor:pointer;font-size:10px;padding:0}
.play:hover{background:#2a5183;color:#fff}
.noplay{color:#333;font-size:11px}
#vmask{position:fixed;inset:0;background:rgba(0,0,0,.82);display:none;align-items:center;justify-content:center;z-index:99}
#vmask.on{display:flex}
#vbox{background:#141414;border:1px solid #333;border-radius:8px;padding:12px;max-width:92vw;max-height:92vh;display:flex;flex-direction:column;gap:8px}
#vbox video{max-width:88vw;max-height:78vh;background:#000;border-radius:4px;display:block}
#vhead{display:flex;justify-content:space-between;align-items:center;gap:20px}
#vtitle{font-size:13px;color:#ddd}
#vclose{background:#222;border:1px solid #444;color:#aaa;border-radius:4px;padding:3px 10px;cursor:pointer;font-size:12px}
#vclose:hover{background:#333;color:#fff}
#vmeta{font-size:11px;color:#666}
.bar{height:6px;background:#222;border-radius:3px;overflow:hidden;min-width:70px;display:inline-block;vertical-align:middle}
.bar i{display:block;height:100%;background:#4da6ff}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-track{background:#141414}
::-webkit-scrollbar-thumb{background:#333;border-radius:5px}
::-webkit-scrollbar-thumb:hover{background:#444}

    CATS.map(function(c){return '<option value="'+esc(c)+'">'+esc(c)+'</option>';}).join('');
  var as=el('f-act');
  as.innerHTML='<option value="All">All actions</option>'+
    ACTIONS.map(function(a){return '<option value="'+esc(a)+'">'+esc(a)+'</option>';}).join('');
  mkGroup('g-stance','Stance',['All'].concat(STANCES),'stance');
  mkGroup('g-persp','View',['All','1st Person','3rd Person'],'persp');
  mkGroup('g-blend','Blend',['All'].concat(BLENDS),'blend');
  mkGroup('g-use','Engine',['All','In Engine','Not Linked'],'use');
})();

function mkGroup(id,label,vals,kind){
  var g=el(id);
  g.innerHTML='<span class="grp-label">'+label+'</span>';
  vals.forEach(function(v){
    var b=document.createElement('button');
    b.className='filt-btn'+(kind==='blend'?' blend-btn':'')+(kind==='use'?' use-btn':'')+(v==='All'?' active':'');
    b.textContent=v==='1st Person'?'1st':v==='3rd Person'?'3rd':v==='Prone (Raised)'?'ProneUp':v;
    b.title=v;
    b.onclick=function(){
      if(kind==='stance')fStance=v; else if(kind==='persp')fPersp=v;
      else if(kind==='blend')fBlend=v; else fUse=v;
      g.querySelectorAll('.filt-btn').forEach(function(x){x.classList.remove('active');});
      b.classList.add('active');
      rerender();
    };
    g.appendChild(b);
  });
}

function resetFilters(){
  el('f-name').value='';el('f-cat').value='All';el('f-act').value='All';
  fStance='All';fPersp='All';fBlend='All';fUse='All';
  ['g-stance','g-persp','g-blend','g-use'].forEach(function(id){
    el(id).querySelectorAll('.filt-btn').forEach(function(b){
      b.classList.toggle('active',b.title==='All');
    });
  });
}

function filtered(base){
  var q=el('f-name').value.trim().toLowerCase();
  var fc=el('f-cat').value, fa=el('f-act').value;
  return base.filter(function(a){
    if(q&&a[F_FILE].toLowerCase().indexOf(q)<0)return false;
    if(fc!=='All'&&a[F_CAT]!==fc)return false;
    if(fa!=='All'&&a[F_ACT]!==fa)return false;
    if(fStance!=='All'&&a[F_STANCE]!==fStance)return false;
    if(fPersp!=='All'&&a[F_PERSP]!==fPersp)return false;
    if(fBlend!=='All'&&a[F_BLEND]!==fBlend)return false;
    if(fUse==='In Engine'&&!a[F_USED])return false;
    if(fUse==='Not Linked'&&a[F_USED])return false;
    return true;
  });
}

function showPanel(p){
  panel=p;resetFilters();
  document.querySelectorAll('.nav-btn').forEach(function(b){
    b.classList.toggle('active',b.getAttribute('data-panel')===p);
  });
  var titles={'__overview__':'Overview','__engine__':'Engine Usage',
              '__all__':'All Animations','__glossary__':'Weapon Glossary',
              '__video__':'Preview Clips'};
  var t=titles[p]||((CAT_LABELS[p.slice(4)]||[p.slice(4)])[0]+' Animations');
  el('panel-title').textContent=t;
  var showFilters=(p==='__all__'||p.indexOf('cat:')===0||(p==='__engine__'&&engineTab==='anim'));
  ['f-name','f-cat','f-act','g-stance','g-persp','g-blend','g-use'].forEach(function(id){
    el(id).style.display=showFilters?'':'none';
  });
  if(p.indexOf('cat:')===0)el('f-cat').style.display='none';
  rerender();
}

function rerender(){
  var c=el('content');
  if(panel==='__overview__'){el('panel-sub').textContent='';return renderOverview(c);}
  if(panel==='__glossary__'){el('panel-sub').textContent='';return renderGlossary(c);}
  if(panel==='__video__'){el('panel-sub').textContent='';return renderVideo(c);}
  if(panel==='__engine__')return renderEngine(c);
  var base=ANIMS;
  if(panel.indexOf('cat:')===0){var k=panel.slice(4);base=ANIMS.filter(function(a){return a[F_CAT]===k;});}
  var rows=filtered(base);
  el('panel-sub').textContent=rows.length+' of '+base.length+' shown';
  renderTable(c,rows);
}

/* ======================= OVERVIEW ======================= */
function renderOverview(c){
  var used=ANIMS.filter(function(a){return a[F_USED];}).length;
  var pct=(100*used/ANIMS.length).toFixed(1);
  var h='<div class="stat-bar">';
  h+='<div class="stat"><span>'+ANIMS.length+'</span><small>Animations on disk</small></div>';
  h+='<div class="stat good"><span>'+used+'</span><small>Linked to engine ('+pct+'%)</small></div>';
  h+='<div class="stat warn"><span>'+(ANIMS.length-used)+'</span><small>Not linked</small></div>';
  h+='<div class="stat"><span>'+CONFIGS.length+'</span><small>Weapon configs</small></div>';
  h+='<div class="stat"><span>'+SLOTS.length+'</span><small>Engine states</small></div>';
  h+='<div class="stat bad"><span>'+ORPHANS.length+'</span><small>Broken CSV refs</small></div>';
  h+='<div class="stat"><span>'+META.withVideo+'</span><small>Preview clips matched</small></div>';
  h+='</div>';
  h+='<div class="note"><b>Anim_filelist.txt</b> = every .anm we have on disk. '+
     '<b>Animation List.csv</b> = what the engine actually binds. '+
     'Generated '+esc(META.generated)+' from '+esc(META.filelist)+' + '+esc(META.csv)+'.</div>';

  h+='<h3 class="sec">Category breakdown</h3>';
  h+='<table class="t" style="max-width:760px"><tr><th>Category</th><th>Description</th>'+
     '<th style="text-align:right">Total</th><th style="text-align:right">In engine</th>'+
     '<th style="text-align:right">Unused</th><th>Coverage</th></tr>';
  CATS.forEach(function(k){
    var set=ANIMS.filter(function(a){return a[F_CAT]===k;});
    if(!set.length)return;
    var u=set.filter(function(a){return a[F_USED];}).length;
    var p=Math.round(100*u/set.length);
    var lab=CAT_LABELS[k]||[k,''];
    h+='<tr><td><b>'+esc(k)+'</b> <span class="muted">'+esc(lab[0])+'</span></td>'+
       '<td class="muted">'+esc(lab[1])+'</td>'+
       '<td style="text-align:right">'+set.length+'</td>'+
       '<td style="text-align:right;color:#7fe3a0">'+u+'</td>'+
       '<td style="text-align:right;color:#e0a060">'+(set.length-u)+'</td>'+
       '<td><span class="bar"><i style="width:'+p+'%"></i></span> <span class="muted">'+p+'%</span></td></tr>';
  });
  h+='</table>';

  h+='<h3 class="sec">Action x stance matrix</h3>';
  h+='<div style="overflow:auto;max-width:100%"><table class="matrix"><tr><th class="rh">Action</th>';
  STANCES.forEach(function(s){h+='<th>'+esc(s)+'</th>';});
  h+='<th>Total</th></tr>';
  ACTIONS.forEach(function(a){
    var set=ANIMS.filter(function(x){return x[F_ACT]===a;});
    h+='<tr><td class="rh">'+esc(a)+'</td>';
    STANCES.forEach(function(s){
      var n=set.filter(function(x){return x[F_STANCE]===s;}).length;
      h+='<td'+(n?'':' class="z"')+'>'+(n||'.')+'</td>';
    });
    h+='<td><b>'+set.length+'</b></td></tr>';
  });
  h+='</table></div>';
  c.innerHTML=h;
}

/* ======================= ENGINE USAGE ======================= */
function renderEngine(c){
  var h='<div class="tabs">'+
    '<button class="tab'+(engineTab==='anim'?' active':'')+'" onclick="setTab(\'anim\')">By Animation</button>'+
    '<button class="tab'+(engineTab==='weapon'?' active':'')+'" onclick="setTab(\'weapon\')">By Weapon Config</button>'+
    '<button class="tab'+(engineTab==='slot'?' active':'')+'" onclick="setTab(\'slot\')">By Engine State</button>'+
    '<button class="tab'+(engineTab==='broken'?' active':'')+'" onclick="setTab(\'broken\')">Broken Refs ('+ORPHANS.length+')</button>'+
    '</div><div id="tabbody"></div>';
  c.innerHTML=h;
  var b=el('tabbody');
  if(engineTab==='anim')return tabByAnim(b);
  if(engineTab==='weapon')return tabByWeapon(b);
  if(engineTab==='slot')return tabBySlot(b);
  return tabBroken(b);
}

function setTab(t){
  engineTab=t;
  var showFilters=(t==='anim');
  ['f-name','f-cat','f-act','g-stance','g-persp','g-blend','g-use'].forEach(function(id){
    el(id).style.display=showFilters?'':'none';
  });
  rerender();
}

/* --- Tab 1: animation -> engine states + weapon configs --- */
function tabByAnim(b){
  var rows=filtered(ANIMS);
  el('panel-sub').textContent=rows.length+' of '+ANIMS.length+' shown';
  var h='<div class="note">Every animation on disk, with the engine states it fills. '+
        '<b class="b-used" style="padding:1px 6px;border-radius:9px">IN ENGINE</b> = bound by at least one weapon config in the CSV. '+
        'Use the <b>Engine</b> filter to isolate unlinked files. Click a row to see the weapon configs.</div>';
  h+='<table class="t"><tr><th style="width:26px"></th><th style="width:34px"></th><th>Animation file</th><th>Status</th>'+
     '<th>Engine states used for</th><th style="text-align:right">Configs</th></tr>';
  rows.forEach(function(a,i){
    var slotNames=a[F_SLOTS].map(function(s){return SLOTS[s];});
    var shown=slotNames.slice(0,6).map(function(s){return '<span class="chip slot">'+esc(s)+'</span>';}).join('');
    if(slotNames.length>6)shown+='<span class="chip">+'+(slotNames.length-6)+' more</span>';
    if(!slotNames.length)shown='<span class="muted">not bound to any engine state</span>';
    var can=a[F_CFGS].length>0;
    h+='<tr'+(can?' class="expander" onclick="toggleAnim(this,'+ANIMS.indexOf(a)+')"':'')+'>'+
       '<td class="arrow">'+(can?'&#9656;':'')+'</td>'+
       '<td>'+playCell(a)+'</td>'+
       '<td class="mono">'+esc(a[F_FILE])+'<br><span class="muted" style="font-size:10.5px">'+
         esc(a[F_ACT])+' &middot; '+esc(a[F_STANCE])+' &middot; '+esc(a[F_PERSP])+' &middot; '+esc(a[F_BLEND])+'</span></td>'+
       '<td><span class="badge '+(a[F_USED]?'b-used">IN ENGINE':'b-unused">NOT LINKED')+'</span></td>'+
       '<td>'+shown+'</td>'+
       '<td style="text-align:right">'+(a[F_CFGS].length||'<span class="muted">0</span>')+'</td></tr>';
  });
  h+='</table>';
  if(!rows.length)h='<div class="empty">No animations match the current filters.</div>';
  b.innerHTML=h;
}

function toggleAnim(tr,idx){
  if(tr.nextSibling&&tr.nextSibling.className==='sub-row'){
    tr.parentNode.removeChild(tr.nextSibling);
    tr.querySelector('.arrow').innerHTML='&#9656;';return;
  }
  var a=ANIMS[idx];
  var slotNames=a[F_SLOTS].map(function(s){return SLOTS[s];});
  var h='<td colspan="6">'+
    '<div style="margin-bottom:7px"><b style="color:#8fb">All engine states ('+slotNames.length+')</b><br>'+
    slotNames.map(function(s){return '<span class="chip slot">'+esc(s)+'</span>';}).join('')+'</div>'+
    '<div><b style="color:#d4a458">Weapon configs referencing it ('+a[F_CFGS].length+')</b><br>'+
    a[F_CFGS].map(function(ci){return '<span class="chip cfg">'+esc(CONFIGS[ci][0])+'</span>';}).join('')+'</div></td>';
  var nr=document.createElement('tr');
  nr.className='sub-row';nr.innerHTML=h;
  tr.parentNode.insertBefore(nr,tr.nextSibling);
  tr.querySelector('.arrow').innerHTML='&#9662;';
}

/* --- Tab 2: weapon config -> all engine state slots --- */
function tabByWeapon(b){
  el('panel-sub').textContent=CONFIGS.length+' weapon configs x '+SLOTS.length+' engine states';
  var h='<div class="note">One row per weapon configuration from <b>Animation List.csv</b>. '+
        'Click to expand all '+SLOTS.length+' engine states and the animation bound to each. '+
        '<span style="color:#e08080">Red</span> = the CSV names a file that is not on disk.</div>';
  h+='<input class="filter-input" style="width:230px;margin-bottom:10px" placeholder="Filter weapon config..." oninput="filterCfgRows(this.value)">';
  h+='<table class="t" id="cfgtable"><tr><th style="width:26px"></th><th>Weapon config</th>'+
     '<th style="text-align:right">Bound states</th><th style="text-align:right">Empty</th>'+
     '<th style="text-align:right">Missing files</th><th>Fill</th></tr>';
  var onDisk={};ANIMS.forEach(function(a){onDisk[a[F_FILE].toLowerCase()]=1;});
  CONFIGS.forEach(function(cfg,ci){
    var bound=cfg[1].length;
    var missing=cfg[1].filter(function(p){return !onDisk[p[1].toLowerCase()];}).length;
    var pct=Math.round(100*bound/SLOTS.length);
    h+='<tr class="expander cfgrow" data-name="'+esc(cfg[0].toLowerCase())+'" onclick="toggleCfg(this,'+ci+')">'+
       '<td class="arrow">&#9656;</td>'+
       '<td class="mono"><b>'+esc(cfg[0])+'</b></td>'+
       '<td style="text-align:right">'+bound+'</td>'+
       '<td style="text-align:right" class="muted">'+(SLOTS.length-bound)+'</td>'+
       '<td style="text-align:right;color:'+(missing?'#e08080':'#444')+'">'+missing+'</td>'+
       '<td><span class="bar"><i style="width:'+pct+'%"></i></span> <span class="muted">'+pct+'%</span></td></tr>';
  });
  h+='</table>';
  b.innerHTML=h;
}

function filterCfgRows(q){
  q=q.trim().toLowerCase();
  document.querySelectorAll('#cfgtable .cfgrow').forEach(function(r){
    r.style.display=(!q||r.getAttribute('data-name').indexOf(q)>=0)?'':'none';
    if(r.nextSibling&&r.nextSibling.className==='sub-row')r.nextSibling.style.display=r.style.display;
  });
}

function toggleCfg(tr,ci){
  if(tr.nextSibling&&tr.nextSibling.className==='sub-row'){
    tr.parentNode.removeChild(tr.nextSibling);
    tr.querySelector('.arrow').innerHTML='&#9656;';return;
  }
  var onDisk={};ANIMS.forEach(function(a){onDisk[a[F_FILE].toLowerCase()]=1;});
  var map={};CONFIGS[ci][1].forEach(function(p){map[p[0]]=p[1];});
  var h='<td colspan="6"><table class="t" style="background:#131313">'+
        '<tr><th style="width:40px">#</th><th style="width:290px">Engine state</th><th>Animation bound</th></tr>';
  for(var i=0;i<SLOTS.length;i++){
    var v=map[i];
    var cell;
    if(!v)cell='<span class="muted">&mdash; none &mdash;</span>';
    else if(onDisk[v.toLowerCase()])cell='<span class="mono" style="color:#9fd6a8">'+esc(v)+'</span>';
    else cell='<span class="mono" style="color:#e08080">'+esc(v)+'</span> <span class="chip" style="background:#301616;color:#e08080">file missing</span>';
    h+='<tr><td class="muted">'+(i+1)+'</td><td>'+esc(SLOTS[i])+'</td><td>'+cell+'</td></tr>';
  }
  h+='</table></td>';
  var nr=document.createElement('tr');nr.className='sub-row';nr.innerHTML=h;
  tr.parentNode.insertBefore(nr,tr.nextSibling);
  tr.querySelector('.arrow').innerHTML='&#9662;';
}
